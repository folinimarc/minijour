name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Serialize releases so two tags cannot deploy concurrently.
concurrency:
  group: pages-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: read
    env:
      VITE_DROPBOX_APP_KEY: ${{ vars.VITE_DROPBOX_APP_KEY }}
      MINIJOUR_TEST_SUBDIRECTORY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag, package versions, and release notes
        run: npm run release:check -- "$GITHUB_REF_NAME"
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Configure Pages (enable it in repository settings first)
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build once and test the exact static output
        run: npm run test:browser
      - name: Package static output and corresponding source
        run: npm run release:package -- "$GITHUB_REF_NAME"
      - name: Upload the same output for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: Publish immutable GitHub Release assets
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested release build
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
